<!DOCTYPE html>
<html>
<head>
    <title>Nipah Risk Mapping - Interactive Layers</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.css" />
    
    <style>
        body { margin: 0; padding: 0; font-family: Arial, sans-serif; }
        #map { position: absolute; top: 0; bottom: 0; width: 100%; }
        
        .info { 
            padding: 10px 12px; 
            background: white; 
            box-shadow: 0 0 15px rgba(0,0,0,0.2); 
            border-radius: 5px; 
            max-width: 300px;
        }
        
        .info h4 { margin: 0 0 5px; color: #333; }
        .info p { margin: 5px 0; font-size: 12px; color: #666; }
        
        .legend {
            line-height: 20px;
            color: #555;
            background: white;
            padding: 10px;
            border-radius: 5px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2);
            max-width: 250px;
            max-height: 70vh;
            overflow-y: auto;
        }
        
        .legend h4 { margin: 0 0 8px; font-size: 14px; }
        
        .legend i {
            width: 20px;
            height: 18px;
            float: left;
            margin-right: 8px;
            opacity: 0.8;
            border: 1px solid #ccc;
        }
        
        .legend .item { 
            margin-bottom: 5px; 
            overflow: hidden; 
            font-size: 11px;
        }
        
        .legend .item.toggleable {
            cursor: pointer;
            padding: 2px 4px;
            border-radius: 3px;
            transition: opacity 0.2s;
        }
        
        .legend .item.toggleable:hover { background: #f0f0f0; }
        
        .legend .item.toggleable.hidden-class {
            opacity: 0.35;
            text-decoration: line-through;
        }
        
        .legend .item.toggleable input[type="checkbox"] {
            margin-right: 4px;
            vertical-align: middle;
            cursor: pointer;
        }
        
        .legend .gradient-bar {
            width: 100%;
            height: 20px;
            margin: 10px 0;
            border: 1px solid #ccc;
        }
        
        .legend .gradient-labels {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            margin-top: 3px;
        }
        
        .legend .plague-cases-section {
            margin-top: 15px;
            padding-top: 10px;
            border-top: 1px solid #ddd;
        }
        
        .legend .plague-case-symbol {
            display: inline-block;
            font-size: 18px;
            color: #1e88e5;
            text-shadow: 1px 1px 2px #FFF, -1px -1px 2px #FFF, 1px -1px 2px #FFF, -1px 1px 2px #FFF;
            margin-right: 8px;
            vertical-align: middle;
        }
        
        .layer-control {
            background: white;
            padding: 10px;
            border-radius: 5px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2);
            max-height: 90vh;
            overflow-y: auto;
            max-width: 220px;
        }
        
        .layer-control h4 { margin: 0 0 10px; font-size: 14px; }
        
        .layer-control label {
            display: block;
            margin: 8px 0;
            cursor: pointer;
            font-size: 13px;
        }
        
        .layer-control input[type="radio"] { margin-right: 8px; }
        .layer-control input[type="checkbox"] { margin-right: 8px; }
        
        .layer-control .overlay-section {
            margin-top: 15px;
            padding-top: 10px;
            border-top: 1px solid #ddd;
        }
        
        .layer-control .overlay-section h5 {
            margin: 0 0 8px;
            font-size: 12px;
            font-weight: bold;
        }
        
        .opacity-section {
            margin-top: 15px;
            padding-top: 10px;
            border-top: 1px solid #ddd;
        }
        
        .opacity-section h5 {
            margin: 0 0 8px;
            font-size: 12px;
            font-weight: bold;
        }
        
        .opacity-control { margin-bottom: 12px; }
        
        .opacity-control label {
            display: block;
            font-size: 11px;
            color: #666;
            margin-bottom: 4px;
        }
        
        .opacity-control input[type="range"] {
            width: 100%;
            height: 4px;
            border-radius: 2px;
            outline: none;
            cursor: pointer;
        }
        
        .opacity-value {
            float: right;
            font-weight: bold;
            color: #333;
            font-size: 11px;
        }
        
        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0 0 15px rgba(0,0,0,0.3);
            z-index: 1000;
            text-align: center;
        }
        
        .error {
            background: #ffebee;
            color: #c62828;
            padding: 10px;
            margin: 5px 0;
            border-radius: 3px;
            font-size: 12px;
        }
        
        .leaflet-popup-content {
            margin: 10px;
            font-size: 12px;
        }
        
        .leaflet-popup-content h3 {
            margin: 0 0 8px;
            font-size: 14px;
            color: #333;
        }
        
        .leaflet-popup-content table {
            width: 100%;
            border-collapse: collapse;
        }
        
        .leaflet-popup-content table td {
            padding: 3px 5px;
            border-bottom: 1px solid #eee;
        }
        
        .leaflet-popup-content table td:first-child {
            font-weight: bold;
            color: #666;
            width: 50%;
        }
        
        .copy-notification {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 15px 25px;
            border-radius: 5px;
            font-size: 14px;
            z-index: 10000;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
        }
        
        .copy-notification.show { opacity: 1; }
        
        .layer-description {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.95);
            padding: 8px 14px;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0,0,0,0.2);
            z-index: 800;
            max-width: 420px;
            font-size: 11px;
            line-height: 1.4;
            color: #333;
            resize: both;
            overflow: auto;
            min-width: 200px;
            min-height: 30px;
            max-height: 200px;
            cursor: default;
        }
        
        .layer-description h4 {
            margin: 0 0 4px;
            font-size: 12px;
            color: #222;
        }
        
        .layer-description p { margin: 0; }
        .layer-description.hidden { display: none; }
    </style>
</head>
<body>
    <div id="map"></div>
    <div id="layer-description" class="layer-description hidden"></div>
    <div id="copy-notification" class="copy-notification"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/georaster@1.6.0/dist/georaster.browser.bundle.min.js"></script>
    <script src="https://unpkg.com/georaster-layer-for-leaflet@3.10.0/dist/georaster-layer-for-leaflet.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chroma-js/2.4.2/chroma.min.js"></script>
    <script src="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.js"></script>

    <script>
        // =====================================================================
        // MAP INITIALIZATION
        // =====================================================================
        var map = L.map('map').setView([19.601194, 78.376465], 6);

        map.createPane('backgroundPane');
        map.getPane('backgroundPane').style.zIndex = 250;
        map.createPane('rasterPane');
        map.getPane('rasterPane').style.zIndex = 300;

        var rasterPaneIds = ['enm', 'enm_cv', 'basic_risk', 'blend_risk', 'risk_blend_cv', 'diff_blend_minus_basic'];
        rasterPaneIds.forEach(function(id, i) {
            map.createPane('raster_' + id);
            map.getPane('raster_' + id).style.zIndex = 310 + i;
        });

        map.createPane('speciesRasterPane');
        map.getPane('speciesRasterPane').style.zIndex = 320;
        map.createPane('speciesVectorPane');
        map.getPane('speciesVectorPane').style.zIndex = 360;
        map.createPane('boundariesPane');
        map.getPane('boundariesPane').style.zIndex = 350;

        var streetMap = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', { attribution: 'Tiles &copy; Esri', maxZoom: 19 });
        var satelliteMap = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { attribution: 'Tiles &copy; Esri', maxZoom: 19 });
        var topoMap = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}', { attribution: 'Tiles &copy; Esri', maxZoom: 19 });
        satelliteMap.addTo(map);

        // =====================================================================
        // STATE VARIABLES
        // =====================================================================
        var layers = {};
        var georasters = {};
        var currentLayer = null;
        var activeLayers = {};
        var loadedCount = 0;
        var totalLayers = 6;
        var nipahCasesLayer = null;
        var adminBoundariesLayer = null;
        var DEFAULT_OPACITY = 1.0;

        var hiddenClasses = {
            'enm': {}, 'enm_cv': {}, 'basic_risk': {}, 'blend_risk': {},
            'risk_blend_cv': {}, 'diff_blend_minus_basic': {}
        };

        var computedDomains = {};

        // M region geometry — stored on load for species clipping
        var mRegionGeometry = null;

        // Ray-casting point-in-polygon for a single ring (array of [lng, lat])
        function pointInRing(lng, lat, ring) {
            var inside = false;
            for (var i = 0, j = ring.length - 1; i < ring.length; j = i++) {
                var xi = ring[i][0], yi = ring[i][1];
                var xj = ring[j][0], yj = ring[j][1];
                var intersect = ((yi > lat) !== (yj > lat)) &&
                    (lng < (xj - xi) * (lat - yi) / (yj - yi) + xi);
                if (intersect) inside = !inside;
            }
            return inside;
        }

        // Test a [lng, lat] point against a GeoJSON geometry (Polygon or MultiPolygon)
        function pointInMRegion(lng, lat) {
            if (!mRegionGeometry) return true;  // no M region loaded = show all
            var geom = mRegionGeometry;
            if (geom.type === 'Polygon') {
                return pointInRing(lng, lat, geom.coordinates[0]);
            }
            if (geom.type === 'MultiPolygon') {
                for (var p = 0; p < geom.coordinates.length; p++) {
                    if (pointInRing(lng, lat, geom.coordinates[p][0])) return true;
                }
                return false;
            }
            return true;
        }

        // =====================================================================
        // VECTOR OVERLAY CONFIGS
        // =====================================================================
        var speciesSurveyLayers = {};
        var speciesSurveyConfigs = {
            'gbif_bats': {
                file: 'gbif_bats.json',
                name: 'GBIF Bat Species Occurrences',
                color: '#8B5CF6', fillColor: '#8B5CF6',
                radius: 5, weight: 1.5, icon: 'circle', colorBySpecies: true
            },
            'nipah_survey': {
                file: 'survey.json',
                name: 'Bat Survey & Phylogeographic Data',
                color: '#10B981', fillColor: '#10B981',
                radius: 7, weight: 2, icon: 'diamond', colorBySpecies: false
            }
        };

        var gbifSpeciesColors = {
            'Pteropus medius':           '#1f78b4',
            'Pteropus giganteus':        '#6a3d9a',
            'Rousettus leschenaultii':   '#e377c2',
            'Hipposideros larvatus':     '#17becf',
            'Pteropus vampyrus':         '#bcbd22',
            'Rousettus amplexicaudatus': '#8c564b'
        };
        var gbifSpeciesList = [];
        var gbifSpeciesCounts = {};
        var hiddenGbifSpecies = {};

        function getGbifSpeciesColor(species) {
            if (!species || species === '') return '#999999';
            return gbifSpeciesColors[species] || '#999999';
        }

        // =====================================================================
        // LAYER CONFIGURATIONS — DESCRIPTIONS UPDATED TO REVISED RESULTS
        // =====================================================================
        var layerConfigs = {
            'enm': {
                file: 'enm_cog.tif',
                name: 'Ecological Niche Model (1km)',
                colors: ['#969696', '#fed976', '#feb24c', '#fd8d3c', '#fc4e2a', '#e31a1c', '#b10026'],
                domain: [0, 0.976],
                labels: ['Low Suitability', 'High Suitability'],
                description: 'Ecological Niche Model (biomod2)',
                mode: 'lch',
                continuousLegend: true,
                useSdStretch: true,
                infoDescription: 'Ensemble median ecological suitability from biomod2 (GLM, MAXNET, MARS) using 90 spatially thinned NiV-associated records and spatial block cross-validation. ' +
                    'Mean validation AUC = 0.691; partial-ROC ratios were 1.933 at the 50% area threshold and 2.667 at the 30% threshold (both p&lt;0.001). ' +
                    'Temperature accounted for 54.7% of grouped variable importance, precipitation 27.6%, and vegetation 17.8%. ' +
                    'Regional and occurrence-definition sensitivity analyses evaluated model robustness. The human-spillover-only model (77 independently thinned records) closely reproduced the integrated surface (Spearman rho = 0.956 overall). ' +
                    'Kerala-specific predictions remain exploratory because of the small regional calibration sample.'
            },
            'enm_cv': {
                file: 'enm_cv.tif',
                name: 'ENM Coefficient of Variation (1km)',
                colors: ['#ffffcc', '#a1dab4', '#41b6c4', '#2c7fb8', '#253494'],
                domain: [7.774, 727.479],
                labels: ['Low Uncertainty', 'High Uncertainty'],
                description: '',
                mode: 'lch',
                continuousLegend: true,
                useSdStretch: true,
                infoDescription: 'Coefficient of variation among ecological niche model predictions, representing spatial uncertainty associated with the GLM, MAXNET, and MARS ensemble. ' +
                    'Lower values indicate greater agreement among model predictions; higher values indicate greater relative variation. Because CV is calculated relative to mean suitability, values can become large where mean suitability approaches zero and should be interpreted alongside the ecological suitability surface. ' +
                    'This layer represents ENM/model uncertainty and is distinct from the 25-scenario parameter-sensitivity CV layer. Kerala-specific inference remains less certain because of the small regional calibration sample.'
            },
            'basic_risk': {
                file: 'risk_basic.tif',
                name: 'Baseline Population Exposure (ENM + Pop)',
                discreteColors: {
                    0: '#000000', 1: '#FFFFBE', 2: '#FFDD00',
                    3: '#FFAA00', 4: '#FF6600', 6: '#FF0000', 9: '#A80000'
                },
                noDataValue: 15,
                labels: ['No Risk', 'Very High Risk'],
                description: '',
                infoDescription: 'Relative population-exposure prioritization surface produced by multiplying independently classified ecological suitability (0-3) and ambient population (0-3), yielding classes {0,1,2,3,4,6,9}. ' +
                    'The index identifies locations where ecological suitability and human population exposure coincide; it is not an externally calibrated probability of NiV spillover, infection, or future case occurrence. ' +
                    'Approximately 137.0 million people (46.1% of the study population) occur in High or Very High categories. Kerala-specific exposure estimates should be interpreted as exploratory.',
                customLegend: true,
                discreteDisplay: true,
                legendItems: [
                    { value: 0, color: '#000000', label: '0 – No Risk' },
                    { value: 1, color: '#FFFFBE', label: '1 – Very Low Risk' },
                    { value: 2, color: '#FFDD00', label: '2 – Low Risk' },
                    { value: 3, color: '#FFAA00', label: '3 – Moderate Risk' },
                    { value: 4, color: '#FF6600', label: '4 – Elevated Risk' },
                    { value: 6, color: '#FF0000', label: '6 – High Risk' },
                    { value: 9, color: '#A80000', label: '9 – Very High Risk' }
                ]
            },
            'blend_risk': {
                file: 'risk_blend.tif',
                name: 'Land-Cover-Weighted Exposure (ENM + Pop + LC)',
                discreteColors: {
                    0: '#000000', 1: '#FFFFBE', 2: '#FFDD00',
                    3: '#FFAA00', 4: '#FF6600', 6: '#FF0000', 9: '#A80000'
                },
                noDataValue: 15,
                labels: ['No Risk', 'Very High Risk'],
                description: '',
                infoDescription: 'Contextual refinement of the baseline population-exposure index using region-specific land-cover weights across 25 sensitivity scenarios (5 alpha values x 5 spatial-blend settings). ' +
                    'Weights compare land-cover representation at outbreak locations with regional background availability and are bounded to [0.7, 1.3]. They are association-based contextual modifiers, not causal estimates or evidence of improved predictive accuracy. ' +
                    'Built area was the only positively associated land-cover class with statistical support, occurring in Bangladesh/West Bengal (permutation p=0.002). ' +
                    'Weighting primarily affected intermediate exposure categories: approximately 46.7 million people shifted from Moderate to Elevated, while 98.7% of High and 99.2% of Very High baseline populations remained in their respective categories.',
                customLegend: true,
                discreteDisplay: true,
                legendItems: [
                    { value: 0, color: '#000000', label: '0 – No Risk' },
                    { value: 1, color: '#FFFFBE', label: '1 – Very Low Risk' },
                    { value: 2, color: '#FFDD00', label: '2 – Low Risk' },
                    { value: 3, color: '#FFAA00', label: '3 – Moderate Risk' },
                    { value: 4, color: '#FF6600', label: '4 – Elevated Risk' },
                    { value: 6, color: '#FF0000', label: '6 – High Risk' },
                    { value: 9, color: '#A80000', label: '9 – Very High Risk' }
                ]
            },
            'risk_blend_cv': {
                file: 'risk_blend_cv.tif',
                name: 'Ensemble CV',
                discreteColors: {
                    0: '#000000', 2: '#edf8b1', 3: '#c7e9b4', 4: '#7fcdbb',
                    5: '#41b6c4', 6: '#1d91c0', 7: '#225ea8', 8: '#0c2c84'
                },
                noDataValue: 255,
                labels: ['Low CV', 'High CV'],
                description: '',
                infoDescription: 'Coefficient of variation across the 25 land-cover-weighting scenarios (5 alpha values x 5 blend-steepness values), measuring sensitivity of the continuous prioritization index to parameter selection. ' +
                    'Mean study-area CV was approximately 5.0%, indicating generally limited variation across scenarios. Blend steepness had negligible influence, while alpha produced a small bounded effect because weights were constrained to [0.7, 1.3]. ' +
                    'This layer measures parameter sensitivity rather than predictive uncertainty or probability of correct class assignment.',
                customLegend: true,
                discreteDisplay: true,
                legendItems: [
                    { value: 0, color: '#000000', label: '0 – No Variability' },
                    { value: 2, color: '#edf8b1', label: '2 – Low CV' },
                    { value: 3, color: '#c7e9b4', label: '3 – Low-Moderate CV' },
                    { value: 4, color: '#7fcdbb', label: '4 – Moderate CV' },
                    { value: 5, color: '#41b6c4', label: '5 – Moderate-High CV' },
                    { value: 6, color: '#1d91c0', label: '6 – High CV' },
                    { value: 7, color: '#225ea8', label: '7 – Very High CV' },
                    { value: 8, color: '#0c2c84', label: '8 – Extreme CV' }
                ]
            },
            'diff_blend_minus_basic': {
                file: 'diff_blend_minus_basic.tif',
                name: 'Normalized Difference Surface',
                discreteColors: {
                    1: '#2166ac', 2: '#67a9cf', 3: '#92c5de',
                    4: '#333333', 5: '#f4a582', 6: '#ef8a62', 7: '#b2182b'
                },
                noDataValue: 15,
                labels: ['Decrease', 'Increase'],
                description: '',
                infoDescription: 'Difference between normalized land-cover-weighted and baseline population-exposure surfaces. Positive values identify locations where land-cover weighting increased the relative index; negative values identify decreases. ' +
                    'The baseline and weighted surfaces retained essentially identical spatial rankings (Spearman rho = 0.999998), indicating that land-cover weighting added limited independent information to the overall spatial hierarchy. ' +
                    'Its principal effect was refinement of intermediate exposure categories, particularly the Moderate-to-Elevated transition, rather than displacement of the highest-priority populations.',
                customLegend: true,
                discreteDisplay: true,
                legendItems: [
                    { value: 1, color: '#2166ac', label: 'Large Decrease' },
                    { value: 2, color: '#67a9cf', label: 'Moderate Decrease' },
                    { value: 3, color: '#92c5de', label: 'Small Decrease' },
                    { value: 4, color: '#333333', label: 'No Change' },
                    { value: 5, color: '#f4a582', label: 'Small Increase' },
                    { value: 6, color: '#ef8a62', label: 'Moderate Increase' },
                    { value: 7, color: '#b2182b', label: 'Large Increase' }
                ]
            }
        };

        // =====================================================================
        // MEASUREMENT TOOLS
        // =====================================================================
        var drawnItems = new L.FeatureGroup();
        map.addLayer(drawnItems);

        var drawControl = new L.Control.Draw({
            position: 'topright',
            draw: {
                polyline: { shapeOptions: { color: '#f357a1', weight: 3 }, metric: true, feet: false, showLength: true },
                polygon:  { shapeOptions: { color: '#f357a1', weight: 3 }, showArea: true, metric: true },
                rectangle: { shapeOptions: { color: '#4CAF50', weight: 3, fillOpacity: 0.1 } },
                circle: false, marker: false, circlemarker: false
            },
            edit: { featureGroup: drawnItems, remove: true }
        });
        map.addControl(drawControl);

        map.on(L.Draw.Event.CREATED, function (event) {
            var layer = event.layer;
            var type  = event.layerType;
            if (type === 'polyline') {
                var length = 0;
                var latlngs = layer.getLatLngs();
                for (var i = 0; i < latlngs.length - 1; i++) length += latlngs[i].distanceTo(latlngs[i+1]);
                layer.bindPopup('<b>Distance:</b> ' + (length/1000).toFixed(2) + ' km');
                drawnItems.addLayer(layer);
            } else if (type === 'polygon') {
                var area = L.GeometryUtil.geodesicArea(layer.getLatLngs()[0]);
                layer.bindPopup('<b>Area:</b> ' + (area/1000000).toFixed(2) + ' km²');
                drawnItems.addLayer(layer);
            } else if (type === 'rectangle') {
                var bounds = layer.getBounds();
                var area2 = (bounds.getNorth()-bounds.getSouth()) * (bounds.getEast()-bounds.getWest()) * 111 * 111;
                layer.bindPopup('<b>Rectangle Area:</b> ~' + area2.toFixed(2) + ' km²');
                drawnItems.addLayer(layer);
            }
        });

        // =====================================================================
        // COORDINATE COPY
        // =====================================================================
        function copyCoordinatesToClipboard(lat, lng) {
            var coordText = lat.toFixed(6) + ', ' + lng.toFixed(6);
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(coordText).then(function() {
                    showCopyNotification('Coordinates copied: ' + coordText);
                }).catch(function() { fallbackCopyTextToClipboard(coordText); });
            } else { fallbackCopyTextToClipboard(coordText); }
        }

        function fallbackCopyTextToClipboard(text) {
            var textArea = document.createElement("textarea");
            textArea.value = text;
            textArea.style.position = "fixed";
            textArea.style.top = "-9999px";
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            try {
                var successful = document.execCommand('copy');
                showCopyNotification(successful ? 'Coordinates copied: ' + text : 'Failed to copy coordinates', !successful);
            } catch (err) { showCopyNotification('Failed to copy coordinates', true); }
            document.body.removeChild(textArea);
        }

        function showCopyNotification(message, isError) {
            var notification = document.getElementById('copy-notification');
            notification.textContent = message;
            notification.style.background = isError ? 'rgba(198,40,40,0.9)' : 'rgba(0,0,0,0.8)';
            notification.classList.add('show');
            setTimeout(function() { notification.classList.remove('show'); }, 2000);
        }

        // =====================================================================
        // UTILITY FUNCTIONS
        // =====================================================================
        function updateStatus(message) { console.log(message); }

        function updateLayerOpacity(layerId, opacity) {
            if (layers[layerId]) layers[layerId].setOpacity(opacity);
        }

        function getRasterValueAtPoint(layerId, latlng) {
            if (!georasters[layerId]) return null;
            try {
                var georaster = georasters[layerId];
                var x = latlng.lng, y = latlng.lat;
                var xmin = georaster.xmin, xmax = georaster.xmax;
                var ymin = georaster.ymin, ymax = georaster.ymax;
                var width = georaster.width, height = georaster.height;
                if (x < xmin || x > xmax || y < ymin || y > ymax) return null;
                var pixelWidth  = (xmax - xmin) / width;
                var pixelHeight = (ymax - ymin) / height;
                var pixelX = Math.floor((x - xmin) / pixelWidth);
                var pixelY = Math.floor((ymax - y) / pixelHeight);
                if (pixelX < 0 || pixelX >= width || pixelY < 0 || pixelY >= height) return null;
                var values = georaster.values;
                if (values && values[0] && values[0][pixelY]) {
                    var value = values[0][pixelY][pixelX];
                    if (value !== null && value !== undefined && !isNaN(value)) {
                        if (value === 255 || value === 15 || value === -9999 || value === -3.4e38 ||
                            Math.abs(value) > 1e10 || value === -32768) return null;
                        if (georaster.noDataValue !== null && georaster.noDataValue !== undefined &&
                            !isNaN(georaster.noDataValue) &&
                            Math.abs(value - georaster.noDataValue) < 0.0001) return null;
                        return value;
                    }
                }
            } catch (error) { console.log('Error getting value for ' + layerId + ':', error); }
            return null;
        }

        // =====================================================================
        // SD STRETCH HELPER
        // Returns [mean - sd, mean + sd], clamped to the observed data range so
        // the ramp is never wasted on values that do not occur in the raster.
        // =====================================================================
        function computeSdDomain(georaster, config) {
            var noDataVal = georaster.noDataValue;
            var rawValues = georaster.values[0];
            var sum = 0, count = 0;
            var dataMin = Infinity, dataMax = -Infinity;

            for (var row = 0; row < rawValues.length; row++) {
                var rowData = rawValues[row];
                for (var col = 0; col < rowData.length; col++) {
                    var v = rowData[col];
                    if (v === null || v === undefined || isNaN(v)) continue;
                    if (v === 255 || v === -9999 || v === -32768 || v === -3.4e38 || Math.abs(v) > 1e10) continue;
                    if (noDataVal !== null && noDataVal !== undefined && !isNaN(noDataVal) && Math.abs(v - noDataVal) < 0.0001) continue;
                    sum += v; count++;
                    if (v < dataMin) dataMin = v;
                    if (v > dataMax) dataMax = v;
                }
            }
            if (count < 2) return config.domain;

            var mean = sum / count;
            var sumSq = 0;
            for (var row2 = 0; row2 < rawValues.length; row2++) {
                var rowData2 = rawValues[row2];
                for (var col2 = 0; col2 < rowData2.length; col2++) {
                    var v2 = rowData2[col2];
                    if (v2 === null || v2 === undefined || isNaN(v2)) continue;
                    if (v2 === 255 || v2 === -9999 || v2 === -32768 || v2 === -3.4e38 || Math.abs(v2) > 1e10) continue;
                    if (noDataVal !== null && noDataVal !== undefined && !isNaN(noDataVal) && Math.abs(v2 - noDataVal) < 0.0001) continue;
                    var diff = v2 - mean; sumSq += diff * diff;
                }
            }
            var sd = Math.sqrt(sumSq / count);

            var lo = Math.max(mean - sd, dataMin);
            var hi = Math.min(mean + sd, dataMax);
            if (!(hi > lo)) return [dataMin, dataMax];
            return [lo, hi];
        }

        // =====================================================================

        // =====================================================================
        function loadAdminBoundaries() {
            fetch('m_region.json')
                .then(function(r) { if (!r.ok) throw new Error('Not found'); return r.json(); })
                .then(function(data) {
                    // Dissolve all features into a single geometry for point-in-polygon clipping
                    if (data.features && data.features.length > 0) {
                        if (data.features.length === 1) {
                            mRegionGeometry = data.features[0].geometry;
                        } else {
                            // Collect all polygons into a MultiPolygon
                            var allCoords = [];
                            data.features.forEach(function(f) {
                                var g = f.geometry;
                                if (g.type === 'Polygon') {
                                    allCoords.push(g.coordinates);
                                } else if (g.type === 'MultiPolygon') {
                                    g.coordinates.forEach(function(c) { allCoords.push(c); });
                                }
                            });
                            mRegionGeometry = { type: 'MultiPolygon', coordinates: allCoords };
                        }
                    }
                    adminBoundariesLayer = L.geoJSON(data, {
                        style: { fillColor: 'transparent', fillOpacity: 0, color: '#000000', weight: 1, opacity: 1 },
                        pane: 'boundariesPane',
                        interactive: false
                    });
                    adminBoundariesLayer.addTo(map);
                })
                .catch(function() { console.log('M-Region boundary file not found'); });
        }

        function createSvgIcon(shape, color, size) {
            var s = size || 12;
            var svg;
            if (shape === 'diamond') {
                var half = s / 2;
                svg = '<svg width="' + s + '" height="' + s + '" viewBox="0 0 ' + s + ' ' + s + '" xmlns="http://www.w3.org/2000/svg">' +
                      '<polygon points="' + half + ',0 ' + s + ',' + half + ' ' + half + ',' + s + ' 0,' + half + '" fill="' + color + '" stroke="#000" stroke-width="1.5"/></svg>';
            } else if (shape === 'triangle') {
                svg = '<svg width="' + s + '" height="' + s + '" viewBox="0 0 ' + s + ' ' + s + '" xmlns="http://www.w3.org/2000/svg">' +
                      '<polygon points="' + (s/2) + ',0 ' + s + ',' + s + ' 0,' + s + '" fill="' + color + '" stroke="#000" stroke-width="1.5"/></svg>';
            } else if (shape === 'square') {
                svg = '<svg width="' + s + '" height="' + s + '" viewBox="0 0 ' + s + ' ' + s + '" xmlns="http://www.w3.org/2000/svg">' +
                      '<rect x="1" y="1" width="' + (s-2) + '" height="' + (s-2) + '" fill="' + color + '" stroke="#000" stroke-width="1.5"/></svg>';
            } else { return null; }
            return L.divIcon({ html: svg, className: '', iconSize: [s, s], iconAnchor: [s/2, s/2] });
        }

                                popupContent += '<tr><td>Coordinates</td><td>' + (p.Latitude ? parseFloat(p.Latitude).toFixed(4) : '') + ', ' + (p.Longitude ? parseFloat(p.Longitude).toFixed(4) : '') + '</td></tr>';
                                if (p.GBIF_Species_URL) popupContent += '<tr><td>GBIF</td><td><a href="' + p.GBIF_Species_URL + '" target="_blank">View</a></td></tr>';
                                popupContent += '</table>';
                            } else if (layerId === 'nipah_survey') {
                                var locName = (p.location_name || '').replace(/_/g, ' ');
                                popupContent = '<h3>' + locName + '</h3><table>';
                                if (p.species)              popupContent += '<tr><td>Species</td><td><em>' + p.species + '</em></td></tr>';
                                if (p.district)             popupContent += '<tr><td>District</td><td>' + p.district + '</td></tr>';
                                if (p.state)                popupContent += '<tr><td>State</td><td>' + p.state + '</td></tr>';
                                if (p.country)              popupContent += '<tr><td>Country</td><td>' + p.country + '</td></tr>';
                                if (p.collection_date)      popupContent += '<tr><td>Collection Date</td><td>' + p.collection_date + '</td></tr>';
                                if (p.total_bats_sampled)   popupContent += '<tr><td>Bats Sampled</td><td>' + p.total_bats_sampled + '</td></tr>';
                                if (p.males_sampled)        popupContent += '<tr><td>Males</td><td>' + p.males_sampled + '</td></tr>';
                                if (p.females_sampled)      popupContent += '<tr><td>Females</td><td>' + p.females_sampled + '</td></tr>';
                                if (p.nipah_rt_pcr_throat_swab) popupContent += '<tr><td>PCR Throat</td><td>' + p.nipah_rt_pcr_throat_swab + '</td></tr>';
                                if (p.nipah_rt_pcr_rectal_swab) popupContent += '<tr><td>PCR Rectal</td><td>' + p.nipah_rt_pcr_rectal_swab + '</td></tr>';
                                if (p.nipah_igg_elisa_results)  popupContent += '<tr><td>IgG ELISA</td><td>' + p.nipah_igg_elisa_results + '</td></tr>';
                                if (p.sample_types)         popupContent += '<tr><td>Sample Types</td><td style="font-size:10px;">' + p.sample_types + '</td></tr>';
                                if (p.test_methods)         popupContent += '<tr><td>Test Methods</td><td style="font-size:10px;">' + p.test_methods + '</td></tr>';
                                if (p.coordinate_precision) popupContent += '<tr><td>Precision</td><td style="font-size:10px;">' + p.coordinate_precision + '</td></tr>';
                                if (p.notes)                popupContent += '<tr><td>Notes</td><td style="font-size:10px;max-width:200px;word-wrap:break-word;">' + p.notes + '</td></tr>';
                                if (p.study)                popupContent += '<tr><td>Study</td><td style="font-size:10px;">' + p.study + '</td></tr>';
                                if (p.data_source)          popupContent += '<tr><td>Source</td><td style="font-size:10px;max-width:200px;word-wrap:break-word;">' + p.data_source + '</td></tr>';
                                popupContent += '</table>';
                            } else {
                                popupContent = '<h3>' + config.name + '</h3><table>';
                                for (var key in p) {
                                    if (p.hasOwnProperty(key) && p[key] !== null && p[key] !== undefined && p[key] !== '' && p[key] !== 'None') {
                                        var dk = key.replace(/_/g, ' ').replace(/\b\w/g, function(l){ return l.toUpperCase(); });
                                        popupContent += '<tr><td>' + dk + '</td><td>' + p[key] + '</td></tr>';

                            layer.bindPopup(popupContent, { maxWidth: 350, maxHeight: 450 });

                    });

                    speciesSurveyLayers[layerId] = geojsonLayer;
                    if (layerId === 'gbif_bats') speciesSurveyLayers['gbif_bats_data'] = data;
                    updateLegend();
                })
                .catch(function(e) { console.log(config.name + ' not found:', e.message); });

        // =====================================================================

        function switchBasemap(type) {
            map.removeLayer(streetMap); map.removeLayer(satelliteMap); map.removeLayer(topoMap);

        // =====================================================================
        // RASTER LAYER LOADING
        // =====================================================================
        function loadLayer(layerId) {
            var config = layerConfigs[layerId];
            fetch(config.file)
                .then(function(r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.arrayBuffer(); })
                .then(function(ab) { return parseGeoraster(ab); })
                .then(function(georaster) {
                    georasters[layerId] = georaster;
                    var layerOpacity  = DEFAULT_OPACITY;
                    var configNoData  = config.noDataValue || null;
                    var pixelValuesToColorFn;

                    if (config.discreteColors) {
                        var dc = config.discreteColors;
                        pixelValuesToColorFn = function(values) {
                            var value = values[0];
                            if (value === null || value === undefined || isNaN(value)) return null;
                            if (value === 255 || value === 15) return null;
                            if (configNoData !== null && value === configNoData) return null;
                            if (georaster.noDataValue !== null && georaster.noDataValue !== undefined &&
                                !isNaN(georaster.noDataValue) && Math.abs(value - georaster.noDataValue) < 0.0001) return null;
                            var iv = Math.round(value);
                            if (hiddenClasses[layerId] && hiddenClasses[layerId][iv]) return null;
                            return dc.hasOwnProperty(iv) ? dc[iv] : null;
                        };
                    } else {
                        var noDataVal    = georaster.noDataValue;
                        var stretchDomain = config.useSdStretch ? computeSdDomain(georaster, config) : config.domain;
                        computedDomains[layerId] = stretchDomain;
                        var scale = config.mode
                            ? chroma.scale(config.colors).mode(config.mode).domain(stretchDomain)
                            : chroma.scale(config.colors).domain(stretchDomain);
                        pixelValuesToColorFn = function(values) {
                            var value = values[0];
                            if (value === null || value === undefined || isNaN(value)) return null;
                            if (value === 255 || value === -9999 || value === -32768 || value === -3.4e38 || Math.abs(value) > 1e10) return null;
                            if (noDataVal !== null && noDataVal !== undefined && !isNaN(noDataVal) && Math.abs(value - noDataVal) < 0.0001) return null;
                            return scale(Math.min(Math.max(value, stretchDomain[0]), stretchDomain[1])).hex();
                        };
                    }

                    var layer = new GeoRasterLayer({
                        georaster: georaster,
                        opacity: layerOpacity,
                        pixelValuesToColorFn: pixelValuesToColorFn,
                        resolution: 256,
                        pane: 'raster_' + layerId
                    });

                    layers[layerId] = layer;
                    loadedCount++;

                    if (layerId === 'enm') {
                        layer.addTo(map);
                        activeLayers[layerId] = true;
                        currentLayer = 'enm';
                        updateLegend();
                        updateDescriptionBox();
                    }
                })
                .catch(function(error) {
                    console.error('Error loading ' + config.name + ':', error);
                    loadedCount++;
                });
        }

        // =====================================================================
        // LAYER TOGGLE / CLASS TOGGLE / REFRESH
        // =====================================================================
        function toggleLayer(layerId, show) {
            if (!layers[layerId]) return;
            if (show) { layers[layerId].addTo(map); activeLayers[layerId] = true; }
            else { map.removeLayer(layers[layerId]); delete activeLayers[layerId]; }
            var analysisLayers = ['enm', 'enm_cv', 'basic_risk', 'blend_risk', 'risk_blend_cv', 'diff_blend_minus_basic'];
            currentLayer = null;
            for (var i = analysisLayers.length - 1; i >= 0; i--) {
                if (activeLayers[analysisLayers[i]]) { currentLayer = analysisLayers[i]; break; }
            }
            updateLegend();
            updateDescriptionBox();
        }

        function updateDescriptionBox() {
            var descDiv = document.getElementById('layer-description');
            if (!currentLayer || !layerConfigs[currentLayer]) { descDiv.classList.add('hidden'); return; }
            var config = layerConfigs[currentLayer];
            if (config.infoDescription) {
                descDiv.innerHTML = '<h4>' + config.name + '</h4><p>' + config.infoDescription + '</p>';
                descDiv.classList.remove('hidden');
            } else { descDiv.classList.add('hidden'); }
        }

        function toggleClass(layerId, classValue, show) {
            if (!hiddenClasses[layerId]) return;
            if (show) { delete hiddenClasses[layerId][classValue]; } else { hiddenClasses[layerId][classValue] = true; }
            refreshLayer(layerId);
        }

        function refreshLayer(layerId) {
            if (!layers[layerId] || !activeLayers[layerId]) return;
            var config   = layerConfigs[layerId];
            var georaster = georasters[layerId];
            if (!georaster) return;
            map.removeLayer(layers[layerId]);
            var layerOpacity = DEFAULT_OPACITY;
            var opacitySlider = document.getElementById('opacity-' + layerId);
            if (opacitySlider) layerOpacity = opacitySlider.value / 100;
            if (!config.discreteColors) return;
            var dc     = config.discreteColors;
            var hidden = hiddenClasses[layerId];
            var configNoData = config.noDataValue || null;
            var pixelValuesToColorFn = function(values) {
                var value = values[0];
                if (value === null || value === undefined || isNaN(value)) return null;
                if (value === 255 || value === 15) return null;
                if (configNoData !== null && value === configNoData) return null;
                if (georaster.noDataValue !== null && georaster.noDataValue !== undefined &&
                    !isNaN(georaster.noDataValue) && Math.abs(value - georaster.noDataValue) < 0.0001) return null;
                var iv = Math.round(value);
                if (hidden[iv]) return null;
                return dc.hasOwnProperty(iv) ? dc[iv] : null;
            };
            var newLayer = new GeoRasterLayer({
                georaster: georaster, opacity: layerOpacity,
                pixelValuesToColorFn: pixelValuesToColorFn,
                resolution: 256, pane: 'raster_' + layerId
            });
            layers[layerId] = newLayer;
            newLayer.addTo(map);
        }

        // =====================================================================
        // LEGEND
        // =====================================================================
        function updateLegend() {
            var legendDiv = document.getElementById('legend-content');
            legendDiv.innerHTML = '';
            var activeKeys = Object.keys(activeLayers);
            if (activeKeys.length === 0) { legendDiv.innerHTML = '<h4>No layers active</h4>'; }

            activeKeys.forEach(function(layerId, idx) {
                if (layerId.startsWith('species_')) return;
                var config = layerConfigs[layerId];
                if (!config) return;
                if (idx > 0) legendDiv.innerHTML += '<div style="margin:10px 0;border-top:1px solid #ddd;"></div>';
                legendDiv.innerHTML += '<h4>' + config.name + '</h4>';
                if (config.customLegend && config.legendItems) {
                    config.legendItems.forEach(function(item) {
                        var isHidden    = hiddenClasses[layerId] && hiddenClasses[layerId][item.value];
                        var checkedAttr = isHidden ? '' : 'checked';
                        var hiddenClass = isHidden ? ' hidden-class' : '';
                        legendDiv.innerHTML += '<div class="item toggleable' + hiddenClass + '">' +
                            '<input type="checkbox" ' + checkedAttr + ' onchange="toggleClass(\'' + layerId + '\', ' + item.value + ', this.checked)">' +
                            '<i style="background:' + item.color + '"></i> ' + item.label + '</div>';
                    });
                } else if (config.continuousLegend) {
                    var stops = config.colors.map(function(c, i) { return c + ' ' + (i/(config.colors.length-1)*100) + '%'; });
                    legendDiv.innerHTML += '<div class="gradient-bar" style="background:linear-gradient(to right,' + stops.join(',') + ');"></div>';
                    legendDiv.innerHTML += '<div class="gradient-labels"><span>' + config.labels[0] + '</span><span>' + config.labels[1] + '</span></div>';
                }
                if (config.description) legendDiv.innerHTML += '<p style="margin-top:10px;font-size:11px;color:#777;">' + config.description + '</p>';
            });

            var activeSpecies = Object.keys(speciesSurveyConfigs).filter(function(k) { return activeLayers['species_' + k]; });
            if (activeSpecies.length > 0) {
                legendDiv.innerHTML += '<div style="margin:10px 0;border-top:1px solid #ddd;"></div>';
                legendDiv.innerHTML += '<h4>Species &amp; Survey Data</h4>';
                activeSpecies.forEach(function(key) {
                    var cfg = speciesSurveyConfigs[key];
                    if (key === 'gbif_bats' && cfg.colorBySpecies && gbifSpeciesList.length > 0) {
                        legendDiv.innerHTML += '<div style="font-size:11px;font-weight:bold;margin-bottom:4px;">GBIF Bat Occurrences by Species</div>';
                        gbifSpeciesList.forEach(function(species) {
                            var color = getGbifSpeciesColor(species);
                            var count = gbifSpeciesCounts[species] || 0;
                            var isHidden = hiddenGbifSpecies[species];
                            var esc = species.replace(/'/g, "\\'").replace(/"/g, '&quot;');
                            legendDiv.innerHTML += '<div class="item toggleable' + (isHidden ? ' hidden-class' : '') + '">' +
                                '<input type="checkbox" ' + (isHidden ? '' : 'checked') + ' onchange="toggleGbifSpecies(\'' + esc + '\', this.checked)">' +
                                '<span style="display:inline-block;width:14px;height:14px;border-radius:50%;background:' + color + ';border:1.5px solid #000;margin-right:6px;vertical-align:middle;"></span>' +
                                '<span style="font-size:11px;"><em>' + species + '</em> <span style="color:#999;">(' + count + ')</span></span></div>';
                        });
                        return;
                    }
                    if (key === 'nipah_survey') {
                        legendDiv.innerHTML += '<div class="item"><svg width="14" height="14" viewBox="0 0 14 14" style="vertical-align:middle;margin-right:8px;"><polygon points="7,0 14,7 7,14 0,7" fill="' + cfg.fillColor + '" stroke="#000" stroke-width="1"/></svg><span style="font-size:11px;">' + cfg.name + '</span></div>';
                        return;
                    }
                    legendDiv.innerHTML += '<div class="item"><span style="display:inline-block;width:14px;height:14px;border-radius:50%;background:' + cfg.fillColor + ';border:1px solid #000;margin-right:8px;vertical-align:middle;"></span><span style="font-size:11px;">' + cfg.name + '</span></div>';
                });
            }

            if (nipahCasesLayer) {
                legendDiv.innerHTML += '<div class="plague-cases-section"><div class="item">' +
                    '<svg width="14" height="14" viewBox="0 0 24 24" style="vertical-align:middle;margin-right:8px;" xmlns="http://www.w3.org/2000/svg">' +
                    '<circle cx="12" cy="12" r="11" fill="white" stroke="#000000" stroke-width="2"/>' +
                    '<circle cx="12" cy="12" r="7" fill="none" stroke="#000000" stroke-width="1.5"/></svg>' +
                    '<span style="font-size:11px;">Nipah Outbreak Locations (2001–2026)</span></div></div>';
            }
        }

        // =====================================================================
        // LAYER CONTROL PANEL
        // =====================================================================
        var layerControl = L.control({position: 'topleft'});
        layerControl.onAdd = function(map) {
            var div = L.DomUtil.create('div', 'layer-control');
            L.DomEvent.disableClickPropagation(div);
            L.DomEvent.disableScrollPropagation(div);

            div.innerHTML = '<h4>Basemaps</h4>';
            div.innerHTML += '<label><input type="radio" name="basemap" value="street" onchange="switchBasemap(\'street\')">Street Map</label>';
            div.innerHTML += '<label><input type="radio" name="basemap" value="satellite" checked onchange="switchBasemap(\'satellite\')">Satellite Imagery</label>';
            div.innerHTML += '<label><input type="radio" name="basemap" value="topo" onchange="switchBasemap(\'topo\')">Topographic</label>';

            div.innerHTML += '<h4 style="margin-top:15px;padding-top:10px;border-top:1px solid #ddd;">Analysis Layers</h4>';
            var rasterKeys = ['enm', 'enm_cv', 'basic_risk', 'blend_risk', 'risk_blend_cv', 'diff_blend_minus_basic'];
            rasterKeys.forEach(function(key) {
                var checked = key === 'enm' ? 'checked' : '';
                div.innerHTML += '<label><input type="checkbox" name="layer" value="' + key + '" ' + checked +
                    ' onchange="toggleLayer(\'' + key + '\', this.checked)">' + layerConfigs[key].name + '</label>';
            });

            div.innerHTML += '<h4 style="margin-top:15px;padding-top:10px;border-top:1px solid #ddd;">Species &amp; Survey Data</h4>';
            Object.keys(speciesSurveyConfigs).forEach(function(key) {
                div.innerHTML += '<label><input type="checkbox" name="species-layer" value="' + key + '" onchange="toggleSpeciesSurveyLayer(\'' + key + '\', this.checked)">' + speciesSurveyConfigs[key].name + '</label>';
            });

            div.innerHTML += '<div class="overlay-section"><h4 style="margin:0 0 8px;font-size:13px;">Overlays</h4>';
            div.innerHTML += '<label><input type="checkbox" id="nipah-cases-toggle" checked onchange="toggleNipahCases(this.checked)">Nipah Outbreak Locations</label>';
            div.innerHTML += '<label><input type="checkbox" id="admin-toggle" checked onchange="toggleAdminBoundaries(this.checked)">M-Region Boundary</label>';
            div.innerHTML += '</div>';

            div.innerHTML += '<div class="opacity-section"><h5>Layer Opacity</h5>';
            rasterKeys.forEach(function(key) {
                div.innerHTML += '<div class="opacity-control">' +
                    '<label>' + layerConfigs[key].name + ' <span class="opacity-value" id="opacity-value-' + key + '">' + Math.round(DEFAULT_OPACITY*100) + '%</span></label>' +
                    '<input type="range" id="opacity-' + key + '" min="0" max="100" value="' + (DEFAULT_OPACITY*100) + '" ' +
                    'oninput="updateLayerOpacity(\'' + key + '\', this.value/100); document.getElementById(\'opacity-value-' + key + '\').textContent=this.value+\'%\'"></div>';
            });
            div.innerHTML += '</div>';
            return div;
        };
        layerControl.addTo(map);

        var legend = L.control({position: 'bottomright'});
        legend.onAdd = function(map) {
            var div = L.DomUtil.create('div', 'legend');
            div.id = 'legend-content';
            L.DomEvent.disableClickPropagation(div);
            L.DomEvent.disableScrollPropagation(div);
            return div;
        };
        legend.addTo(map);

        // =====================================================================
        // MAP CLICK & CONTEXT MENU
        // =====================================================================
        map.on('contextmenu', function(e) { copyCoordinatesToClipboard(e.latlng.lat, e.latlng.lng); });

        map.on('click', function(e) {
            if (!currentLayer || !georasters[currentLayer]) return;
            var config = layerConfigs[currentLayer];

            // ENM and ENM CV: show coordinates only — cell values not meaningful to display
            if (currentLayer === 'enm' || currentLayer === 'enm_cv') {
                var popupCoord = '<h3>' + config.name + '</h3><table>' +
                    '<tr><td>Latitude</td><td>'  + e.latlng.lat.toFixed(6) + '</td></tr>' +
                    '<tr><td>Longitude</td><td>' + e.latlng.lng.toFixed(6) + '</td></tr>' +
                    '</table>';
                L.popup().setLatLng(e.latlng).setContent(popupCoord).openOn(map);
                return;
            }

            var value = getRasterValueAtPoint(currentLayer, e.latlng);
            var displayValue;
            if (value !== null) {
                if (config.discreteDisplay) {
                    var iv = Math.round(value);
                    displayValue = iv.toString();
                    if (config.legendItems) {
                        for (var i = 0; i < config.legendItems.length; i++) {
                            if (config.legendItems[i].value === iv) { displayValue = config.legendItems[i].label; break; }
                        }
                    }
                } else { displayValue = value.toFixed(4); }
            } else { displayValue = 'No Data'; }
            var popupContent = '<h3>' + config.name + '</h3><table>';
            popupContent += '<tr><td>Coordinates</td><td>' + e.latlng.lat.toFixed(6) + ', ' + e.latlng.lng.toFixed(6) + '</td></tr>';
            popupContent += '<tr><td>Cell Value</td><td>' + displayValue + '</td></tr>';
            popupContent += '</table>';
            L.popup().setLatLng(e.latlng).setContent(popupContent).openOn(map);
        });

        // =====================================================================
        // LOAD ALL LAYERS
        // =====================================================================
        // Show the ENM description immediately, before the raster finishes
        // downloading, so the box is present the moment the map opens.
        currentLayer = 'enm';
        updateDescriptionBox();
        updateLegend();

        Object.keys(layerConfigs).forEach(function(key) { loadLayer(key); });
        loadNipahCases();
        loadAdminBoundaries();
        Object.keys(speciesSurveyConfigs).forEach(function(key) { loadSpeciesSurveyLayer(key); });

    </script>
</body>
</html>
